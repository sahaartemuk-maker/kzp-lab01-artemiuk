name: Python CI (ЛР6–7)

on:
  push:
    branches: [main]
    paths: ["python/**", ".github/workflows/python.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["python/**", ".github/workflows/python.yml"]
  workflow_dispatch:

jobs:
  python:
    name: python-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: python
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: Build wheel
        run: python -m build

      - name: Install wheel into clean venv and run CLI
        run: |
          python -m venv .venv-wheel
          if [ -x .venv-wheel/Scripts/python.exe ]; then PY=.venv-wheel/Scripts/python.exe; else PY=.venv-wheel/bin/python; fi
          "$PY" -m pip install --no-deps dist/*.whl
          "$PY" -m kzp_lab07.cli data/input.csv reports/wheel-summary.txt
          cat reports/wheel-summary.txt

      - name: CLI error scenario must exit 1
        run: |
          printf 'date,kind,duration,distance,pulse\n2026-09-01,Біг,x,1,1\n' > broken.csv
          set +e
          python -m kzp_lab07.cli broken.csv reports/broken.txt
          code=$?
          set -e
          echo "exit=$code"
          test "$code" -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: kzp-lab07-wheel-${{ matrix.os }}
          path: python/dist/*.whl
